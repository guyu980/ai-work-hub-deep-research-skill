<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --paper: #f5f4f1;
      --surface: #fbfaf8;
      --surface-solid: #ffffff;
      --ink: #2e2d29;
      --graphite: #3f3c35;
      --muted: #66635d;
      --line: #d8d6d0;
      --accent: #8c1515;
      --accent-deep: #820000;
      --accent-soft: #f1dfdf;
      --accent-tint: #faf0f0;
      --sidebar-bg: #8c1515;
      --sidebar-ink: #ffffff;
      --sidebar-muted: #efd9db;
      --sidebar-line: rgba(255,255,255,.22);
      --table-head: #8c1515;
      --table-head-ink: #ffffff;
      --row-alt: #f7f5f2;
      --shadow: 0 14px 36px rgba(46,45,41,.08);
      --article-size: 17px;
      --article-width: 920px;
    }
    html[data-theme="dark"] {
      --paper: #171716;
      --surface: #20201c;
      --surface-solid: #252520;
      --ink: #f5f4f1;
      --graphite: #e1dfda;
      --muted: #aaa89f;
      --line: #3f3e38;
      --accent: #d88991;
      --accent-deep: #f0a5ac;
      --accent-soft: #3b2426;
      --accent-tint: #2f2022;
      --sidebar-bg: #681010;
      --sidebar-ink: #ffffff;
      --sidebar-muted: #e3c2c5;
      --sidebar-line: rgba(255,255,255,.20);
      --table-head: #681010;
      --table-head-ink: #ffffff;
      --row-alt: #252520;
      --shadow: 0 14px 36px rgba(0,0,0,.24);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    #progress { position: fixed; z-index: 100; inset: 0 auto auto 0; width: 0; height: 3px; background: var(--accent-deep); }
    .layout { display: grid; grid-template-columns: 300px minmax(0,1fr); min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20; width: 300px; padding: 34px 24px 26px;
      overflow: auto; border-right: 1px solid var(--sidebar-line); color: var(--sidebar-ink); background: var(--sidebar-bg);
    }
    .sidebar-close { position: absolute; top: 17px; right: 17px; display: none; width: 34px; height: 34px; place-items: center; border: 1px solid var(--sidebar-line); border-radius: 6px; color: var(--sidebar-ink); background: transparent; cursor: pointer; font-size: 21px; line-height: 1; }
    .sidebar-close:hover { background: rgba(255,255,255,.12); }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; color: var(--sidebar-ink); font-size: 11px; font-weight: 750; letter-spacing: 0; }
    .eyebrow::before { width: 3px; height: 16px; border-radius: 1px; background: var(--sidebar-ink); content: ""; opacity: .9; }
    .sidebar-title { margin: 0 0 10px; font-size: 22px; line-height: 1.38; letter-spacing: 0; }
    .sidebar-meta { margin-bottom: 28px; color: var(--sidebar-muted); font-size: 11.5px; line-height: 1.65; }
    .toc-label { margin-bottom: 10px; padding-top: 16px; border-top: 1px solid var(--sidebar-line); color: var(--sidebar-muted); font-size: 11px; font-weight: 750; letter-spacing: 0; }
    #toc { display: flex; flex-direction: column; gap: 2px; padding-bottom: 28px; }
    #toc a { display: block; padding: 8px 10px; border-left: 2px solid transparent; border-radius: 0 4px 4px 0; color: var(--sidebar-muted); font-size: 12.5px; line-height: 1.45; text-decoration: none; }
    #toc a.toc-h3 { padding-left: 20px; font-size: 11.5px; }
    #toc a:hover,#toc a.active { border-left-color: var(--sidebar-ink); color: var(--sidebar-ink); background: rgba(255,255,255,.12); }
    .content-shell { grid-column: 2; min-width: 0; padding: 24px 56px 80px; }
    .toolbar { position: sticky; z-index: 15; top: 12px; display: flex; justify-content: flex-end; gap: 6px; width: min(100%,calc(var(--article-width) + 80px)); margin: 0 auto 16px; pointer-events: none; }
    .tool-button { display: grid; min-width: 36px; height: 36px; padding: 0 10px; place-items: center; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--surface); box-shadow: 0 4px 12px rgba(46,45,41,.06); cursor: pointer; font-size: 13px; pointer-events: auto; }
    .tool-button:hover { border-color: var(--accent); color: var(--accent); }
    .tool-button:focus-visible, .sidebar-close:focus-visible, #toc a:focus-visible, article a:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
    #menu-toggle { display: none; }
    article { width: min(100%,var(--article-width)); margin: 0 auto; padding: 64px 68px 76px; border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: 4px; color: var(--graphite); background: var(--surface); box-shadow: var(--shadow); font-size: var(--article-size); line-height: 1.8; overflow-wrap: anywhere; }
    .report-cover { margin-bottom: 58px; padding-bottom: 42px; border-bottom: 1px solid var(--line); }
    .cover-kicker { margin-bottom: 18px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: 0; }
    .report-cover h1 { margin: 0 0 26px; max-width: 16em; color: var(--ink); font-size: 50px; line-height: 1.16; letter-spacing: 0; }
    .report-deck { padding: 17px 20px; border-left: 4px solid var(--accent); border-radius: 0 4px 4px 0; color: var(--graphite); background: var(--accent-tint); font-size: 15px; line-height: 1.7; }
    article h1 { margin: 2.2em 0 .7em; color: var(--ink); font-size: 2.1em; line-height: 1.25; letter-spacing: 0; }
    article h2 { margin: 2.6em 0 .8em; padding-top: 1.05em; border-top: 1px solid var(--line); color: var(--ink); font-size: 1.72em; line-height: 1.3; letter-spacing: 0; }
    article h2::before { display: inline-block; width: 4px; height: .9em; margin-right: 10px; border-radius: 1px; background: var(--accent); content: ""; vertical-align: -.03em; }
    .report-cover + h2 { margin-top: 0; padding-top: 0; border-top: 0; }
    article h3 { margin: 2.1em 0 .7em; color: var(--accent); font-size: 1.34em; line-height: 1.4; letter-spacing: 0; }
    article h4 { margin: 1.8em 0 .6em; font-size: 1.08em; }
    article h5 { margin: 1.55em 0 .5em; color: var(--accent); font-size: .98em; }
    article h1,article h2,article h3,article h4,article h5 { scroll-margin-top: 74px; }
    article p { margin: .9em 0; }
    article a { color: var(--accent); text-underline-offset: 3px; }
    article ul,article ol { padding-left: 1.55em; }
    article li { margin: .42em 0; padding-left: .22em; }
    article li::marker { color: var(--accent); font-weight: 700; }
    article blockquote { margin: 1.5em 0; padding: 17px 20px; border-left: 4px solid var(--accent); border-radius: 0 4px 4px 0; color: var(--ink); background: var(--accent-tint); }
    article blockquote p { margin: .25em 0; }
    .table-wrap { margin: 1.5em 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
    article table { width: 100%; border-collapse: collapse; font-family: ui-sans-serif,"PingFang SC",sans-serif; font-size: .88em; line-height: 1.5; }
    article th,article td { min-width: 108px; padding: 11px 13px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); vertical-align: top; }
    article th { color: var(--table-head-ink); background: var(--table-head); text-align: left; }
    article tbody tr:nth-child(even) td { background: var(--row-alt); }
    article tr:last-child td { border-bottom: 0; }
    article th:last-child,article td:last-child { border-right: 0; }
    article img { display: block; width: 100%; height: auto; margin: 1.8em auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-solid); cursor: zoom-in; }
    article code { padding: .15em .36em; border-radius: 4px; background: var(--accent-soft); font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: .88em; }
    article pre { overflow: auto; padding: 18px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--accent-tint); line-height: 1.55; }
    article pre code { padding: 0; background: transparent; }
    .image-modal { position: fixed; z-index: 200; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; background: rgba(20,18,18,.88); }
    .image-modal.open { display: flex; }
    .image-modal img { max-width: 96vw; max-height: 94vh; object-fit: contain; }
    .back-top { position: fixed; z-index: 30; right: 23px; bottom: 22px; opacity: 0; transform: translateY(8px); transition: 160ms ease; }
    .back-top.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 980px) {
      .layout { display: block; }
      .sidebar { transform: translateX(-105%); transition: transform 180ms ease; box-shadow: var(--shadow); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-close { display: grid; }
      .content-shell { padding: 16px 18px 64px; }
      #menu-toggle { display: grid; margin-right: auto; }
      article { padding: 50px 36px 60px; }
      .report-cover h1 { font-size: 40px; }
    }
    @media (max-width: 560px) {
      .sidebar { width: min(320px,88vw); }
      .content-shell { padding: 8px 10px 48px; }
      article { padding: 36px 20px 50px; font-size: 16px; line-height: 1.76; }
      .report-cover { margin-bottom: 44px; padding-bottom: 34px; }
      .report-cover h1 { font-size: 32px; line-height: 1.2; }
      article h2 { font-size: 1.5em; }
      .toolbar { top: 7px; }
      .tool-button { height: 34px; min-width: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .sidebar,.back-top { transition: none; }
    }
    @media print {
      :root { --paper:#fff; --surface:#fff; --ink:#000; --muted:#333; --line:#ccc; }
      .sidebar,.toolbar,.back-top,#progress { display:none!important; }
      .content-shell { padding:0; }
      article { width:100%; max-width:none; padding:0; border:0; color:#000; box-shadow:none; font-size:11pt; }
      article h1,article h2,article h3 { break-after:avoid; }
      article img,article table { break-inside:avoid; }
    }
  </style>
</head>
<body>
  <div id="progress" aria-hidden="true"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="文章目录">
      <button class="sidebar-close" id="sidebar-close" type="button" aria-label="关闭目录" title="关闭目录">×</button>
      <div class="eyebrow">AI WORK HUB RESEARCH</div>
      <h2 class="sidebar-title">{{TITLE}}</h2>
      <div class="sidebar-meta">{{DATE}}<br>{{SUBTITLE}}</div>
      <div class="toc-label">目录 / CONTENTS</div>
      <nav id="toc"></nav>
    </aside>
    <main class="content-shell">
      <div class="toolbar">
        <button class="tool-button" id="menu-toggle" type="button" aria-label="打开目录" title="打开目录">☰</button>
        <button class="tool-button" id="font-down" type="button" aria-label="缩小字号" title="缩小字号">A−</button>
        <button class="tool-button" id="font-up" type="button" aria-label="放大字号" title="放大字号">A＋</button>
        <button class="tool-button" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">◐</button>
      </div>
      <article id="article">
        <header class="report-cover">
          <div class="cover-kicker">AI WORK HUB / DEEP RESEARCH</div>
          <h1>{{TITLE}}</h1>
          <div class="report-deck">{{SUBTITLE}}<br>{{DATE}}</div>
        </header>
{{ARTICLE_HTML}}
      </article>
    </main>
  </div>
  <button class="tool-button back-top" id="back-top" type="button" aria-label="返回顶部" title="返回顶部">↑</button>
  <div class="image-modal" id="image-modal" role="dialog" aria-modal="true" aria-label="查看大图"><img alt=""></div>
  <script>
    (() => {
      const root = document.documentElement;
      const article = document.getElementById('article');
      const toc = document.getElementById('toc');
      const sidebar = document.getElementById('sidebar');
      const progress = document.getElementById('progress');
      const backTop = document.getElementById('back-top');
      const modal = document.getElementById('image-modal');
      const modalImage = modal.querySelector('img');
      const safeSlug = (text, fallback) => {
        const slug = text.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'');
        return slug || `section-${fallback}`;
      };
      const headings = [...article.querySelectorAll('h1:not(.report-cover h1), h2, h3')];
      const used = new Set();
      headings.forEach((heading,index) => {
        let id = safeSlug(heading.textContent,index+1); let suffix = 2;
        while (used.has(id)) id = `${id}-${suffix++}`;
        used.add(id); heading.id = id;
        const link = document.createElement('a');
        link.href = `#${id}`;
        link.className = heading.tagName === 'H3' ? 'toc-h3' : 'toc-h2';
        link.textContent = heading.textContent;
        toc.appendChild(link);
      });
      article.querySelectorAll('table').forEach(table => {
        if (table.parentElement.classList.contains('table-wrap')) return;
        const wrap = document.createElement('div'); wrap.className = 'table-wrap';
        table.parentNode.insertBefore(wrap,table); wrap.appendChild(table);
      });
      article.querySelectorAll('img').forEach(img => img.addEventListener('click',() => {
        modalImage.src = img.src; modalImage.alt = img.alt; modal.classList.add('open');
      }));
      modal.addEventListener('click',() => { modal.classList.remove('open'); modalImage.src = ''; });
      document.getElementById('menu-toggle').addEventListener('click',() => sidebar.classList.toggle('open'));
      document.getElementById('sidebar-close').addEventListener('click',() => sidebar.classList.remove('open'));
      toc.addEventListener('click',() => sidebar.classList.remove('open'));
      addEventListener('keydown',event => {
        if (event.key !== 'Escape') return;
        sidebar.classList.remove('open');
        modal.classList.remove('open');
        modalImage.src = '';
      });
      document.getElementById('theme-toggle').addEventListener('click',() => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      });
      const changeFont = delta => {
        const current = parseFloat(getComputedStyle(root).getPropertyValue('--article-size')) || 17;
        root.style.setProperty('--article-size',`${Math.max(14,Math.min(22,current+delta))}px`);
      };
      document.getElementById('font-down').addEventListener('click',() => changeFont(-1));
      document.getElementById('font-up').addEventListener('click',() => changeFont(1));
      backTop.addEventListener('click',() => window.scrollTo({top:0,behavior:'smooth'}));
      const links = [...toc.querySelectorAll('a')];
      const observer = new IntersectionObserver(entries => {
        const visible = entries.filter(entry => entry.isIntersecting).sort((a,b) => a.boundingClientRect.top-b.boundingClientRect.top)[0];
        if (!visible) return;
        links.forEach(link => link.classList.toggle('active',link.hash === `#${visible.target.id}`));
      },{rootMargin:'-12% 0px -76% 0px'});
      headings.forEach(heading => observer.observe(heading));
      const onScroll = () => {
        const max = document.documentElement.scrollHeight-innerHeight;
        progress.style.width = `${max > 0 ? scrollY/max*100 : 0}%`;
        backTop.classList.toggle('visible',scrollY > 700);
      };
      addEventListener('scroll',onScroll,{passive:true}); onScroll();
    })();
  </script>
</body>
</html>
