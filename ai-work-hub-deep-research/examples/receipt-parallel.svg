<text x="604" y="548" font-size="28" fill="#8C1515" font-weight="700" text-anchor="end">16 分钟</text>
<line x1="180" y1="596" x2="180" y2="839" stroke="#D8D6D0" stroke-width="1" />
<text x="180" y="588" font-size="22" fill="#66635D" font-weight="400" text-anchor="middle">0</text>
<line x1="260" y1="596" x2="260" y2="839" stroke="#D8D6D0" stroke-width="1" />
<text x="260" y="588" font-size="22" fill="#66635D" font-weight="400" text-anchor="middle">4</text>
<line x1="340" y1="596" x2="340" y2="839" stroke="#D8D6D0" stroke-width="1" />
<text x="340" y="588" font-size="22" fill="#66635D" font-weight="400" text-anchor="middle">8</text>
<line x1="420" y1="596" x2="420" y2="839" stroke="#D8D6D0" stroke-width="1" />
<text x="420" y="588" font-size="22" fill="#66635D" font-weight="400" text-anchor="middle">12</text>
<line x1="500" y1="596" x2="500" y2="839" stroke="#D8D6D0" stroke-width="1" />
<text x="500" y="588" font-size="22" fill="#66635D" font-weight="400" text-anchor="middle">16</text>
<line x1="580" y1="596" x2="580" y2="839" stroke="#D8D6D0" stroke-width="1" />
<text x="580" y="588" font-size="22" fill="#66635D" font-weight="400" text-anchor="middle">20</text>
<text x="32" y="632" font-size="24" fill="#2E2D29" font-weight="400" text-anchor="start">上传</text>
<rect x="180" y="606" width="40" height="35" rx="4" fill="#A7A39A" stroke="none" />
<text x="200.0" y="631" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="32" y="681" font-size="24" fill="#2E2D29" font-weight="400" text-anchor="start">识别票面</text>
<rect x="220" y="655" width="120" height="35" rx="4" fill="#8C1515" stroke="none" />
<text x="280.0" y="680" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
<text x="32" y="730" font-size="24" fill="#2E2D29" font-weight="400" text-anchor="start">读取规则</text>
<rect x="220" y="704" width="80" height="35" rx="4" fill="#A7A39A" stroke="none" />
<text x="260.0" y="729" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
<text x="32" y="779" font-size="24" fill="#2E2D29" font-weight="400" text-anchor="start">字段匹配</text>
<rect x="340" y="753" width="60" height="35" rx="4" fill="#A7A39A" stroke="none" />
<text x="370.0" y="778" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="32" y="828" font-size="24" fill="#2E2D29" font-weight="400" text-anchor="start">人工复核</text>
<rect x="400" y="802" width="100" height="35" rx="4" fill="#2E2D29" stroke="none" />
<text x="450.0" y="827" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
<rect x="300" y="704" width="40" height="35" rx="0" fill="url(#wait)" stroke="#D8D6D0" />
<text x="391" y="730" font-size="22" fill="#66635D" font-weight="400" text-anchor="start">等 2 分钟</text>
<line x1="340" y1="690" x2="340" y2="753" stroke="#8C1515" stroke-width="2" />
<line x1="32" y1="480" x2="608" y2="480" stroke="#D8D6D0" stroke-width="1" />
<text x="32" y="898" font-size="24" fill="#2E2D29" font-weight="600" text-anchor="start">规则读取先完成，但匹配仍需等待识别。</text>
<text x="32" y="936" font-size="23" fill="#66635D" font-weight="400" text-anchor="start">条长表示耗时；斜纹表示完成后的等待。</text>
</g></svg>